# Publishes the forwarding page in game/ to GitHub Pages. The game itself moved to
# runningfit/diamond-grab as Diamond Grab; this keeps the old address sending players there and
# retires the offline copy that phones installed from it. The auth worker in src/ is deployed
# separately by Cloudflare and is not affected by this workflow.
name: Deploy the Diamond Grab forwarding page

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game

      - id: deployment
        uses: actions/deploy-pages@v4
