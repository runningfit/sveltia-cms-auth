<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rockfall sprite sheet</title>
    <style>
      body {
        margin: 0;
        background: #0a0a11;
        color: #e8e8f4;
        font:
          12px 'Courier New',
          monospace;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px;
        list-style: none;
      }
      li {
        text-align: center;
      }
      canvas {
        display: block;
        background: #05050a;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <ul id="sheet"></ul>
    <script src="js/art.js"></script>
    <script>
      const sheet = new window.Rockfall.Art.SpriteSheet();
      sheet.resize(64);
      const list = document.getElementById('sheet');
      sheet.cache.forEach((frames, name) => {
        frames.forEach((bitmap, i) => {
          const item = document.createElement('li');
          const holder = document.createElement('canvas');
          holder.width = 64;
          holder.height = 64;
          holder.getContext('2d').drawImage(bitmap, 0, 0);
          const label = document.createElement('div');
          label.textContent = `${name} ${i}`;
          item.append(holder, label);
          list.append(item);
        });
      });
    </script>
  </body>
</html>
