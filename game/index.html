<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101018" />
    <meta
      name="description"
      content="Rockfall — a browser remake of the Acorn Archimedes boulder-and-gems classic."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rockfall" />
    <title>Rockfall</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101018'/%3E%3Cpath d='M8 2l5 6-5 6-5-6z' fill='%236fd8ff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="cabinet" class="cabinet">
      <header class="hud" id="hud">
        <div class="hud-group">
          <span class="hud-label">CAVE</span>
          <span class="hud-value" id="hud-cave">A</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">GEMS</span>
          <span class="hud-value" id="hud-gems">0/0</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">TIME</span>
          <span class="hud-value" id="hud-time">000</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">SCORE</span>
          <span class="hud-value" id="hud-score">000000</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">MEN</span>
          <span class="hud-value" id="hud-lives">3</span>
        </div>
        <div class="hud-group optional">
          <span class="hud-label">BOMBS</span>
          <span class="hud-value" id="hud-bombs">0</span>
        </div>
        <div class="hud-buttons">
          <button
            type="button"
            class="icon-button"
            id="btn-install"
            aria-label="Install Rockfall"
            title="Install Rockfall"
            hidden
          >
            &#10515;
          </button>
          <button type="button" class="icon-button" id="btn-sound" aria-label="Toggle sound">
            &#9835;
          </button>
          <button type="button" class="icon-button" id="btn-pause" aria-label="Pause">
            &#10073;&#10073;
          </button>
        </div>
      </header>

      <main class="stage" id="stage">
        <canvas id="screen" width="640" height="400"></canvas>

        <div class="overlay" id="overlay" hidden>
          <div class="panel" id="panel">
            <h1 class="panel-title" id="panel-title">ROCKFALL</h1>
            <p class="panel-text" id="panel-text"></p>
            <div class="panel-keys" id="panel-keys"></div>
            <div
              class="segmented"
              id="panel-controls"
              role="radiogroup"
              aria-label="Touch controls"
              hidden
            >
              <button type="button" role="radio" data-mode="stick" aria-checked="true">
                Joystick
              </button>
              <button type="button" role="radio" data-mode="pad" aria-checked="false">D-pad</button>
            </div>
            <button type="button" class="big-button" id="panel-button">START</button>
          </div>
        </div>

        <div class="touch-layer" id="touch-layer" hidden>
          <div class="joystick" id="joystick" aria-hidden="true">
            <div class="joystick-base">
              <div class="joystick-knob"></div>
            </div>
          </div>
          <div class="dpad" id="dpad">
            <button type="button" class="dpad-key up" data-dir="up" aria-label="Up"></button>
            <button type="button" class="dpad-key left" data-dir="left" aria-label="Left"></button>
            <button
              type="button"
              class="dpad-key right"
              data-dir="right"
              aria-label="Right"
            ></button>
            <button type="button" class="dpad-key down" data-dir="down" aria-label="Down"></button>
            <span class="dpad-hub"></span>
          </div>
          <button type="button" class="action-key" id="btn-bomb" aria-label="Drop bomb">
            <span class="action-glyph">&#9679;</span>
            <span class="action-count" id="bomb-count">0</span>
          </button>
        </div>
      </main>

      <footer class="tips" id="tips">
        <span class="tip-desktop"
          >Arrows / WASD move &middot; Space drops a bomb &middot; P pause &middot; R restart
          cave</span
        >
        <span class="tip-touch">Stick or swipe to steer &middot; Double tap for a bomb</span>
      </footer>
    </div>

    <script src="js/art.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
