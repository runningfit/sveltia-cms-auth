version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
words:
  - appinstalled
  - Archimedes
  - beforeinstallprompt
  - cooldown
  - CVEs
  - Decap
  - esbuild
  - Eterna
  - GHSA
  - Ghsas
  - headlessly
  - hostnames
  - jsdoc
  - kyoshino
  - PKCE
  - playfield
  - pulsator
  - pulsators
  - Rockslide
  - Rockfall
  - singleline
  - Sveltia
  - undici
  - unrs
  - WASD
  - workerd
overrides:
  # The pixel art grids in the game are strings of palette keys, not words.
  - filename: "game/js/art.js"
    ignoreRegExpList:
      - "'[.0-9a-k]{16}'"
